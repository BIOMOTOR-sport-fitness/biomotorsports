server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  location = /sw.js { add_header Cache-Control "no-cache"; }
  # code and pages: always check for a newer version (ETag), so every deploy shows at once
  location ~* \.(js|css|html|webmanifest)$ { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }
  location = / { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; try_files /index.html =404; }
  location ~ \.sk$ { default_type text/plain; add_header Cache-Control "no-cache"; }
  location = /download { try_files /download.html =404; }
  location / { try_files $uri $uri/ /index.html; }
}
