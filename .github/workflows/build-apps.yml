# Builds the BIOMOTOR apps and publishes them on GitHub Releases.
# Run it: GitHub → Actions → "Build BIOMOTOR apps" → Run workflow   (or push a tag like v1.0.1)
# The website's download page links to:  releases/latest/download/<file name>
name: Build BIOMOTOR apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
    
      - name: Make the package file from package.shubham
        run: node tools/shubham-build.js apps/mobile/package.shubham
      - name: Install Capacitor
        working-directory: apps/mobile
        run: npm install
      - name: Add Google MediaPipe body tracking
        run: node tools/fetch-mediapipe.js
      - name: Copy the web app
        working-directory: apps/mobile
        run: npm run prepare-web
      - name: Create Android project
        working-directory: apps/mobile
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --splashBackgroundColor '#ffffff' || echo "icon generation skipped"
          npx cap sync android
      - name: Build APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/BIOMOTOR-Android.apk"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: BIOMOTOR-Android.apk }

  desktop:
    name: Desktop ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Make the package file from package.shubham
        run: node tools/shubham-build.js apps/desktop/package.shubham
      - name: Install Electron
        working-directory: apps/desktop
        run: npm install
      - name: Add Google MediaPipe body tracking
        run: node tools/fetch-mediapipe.js
      - name: Copy the web app
        working-directory: apps/desktop
        run: npm run prepare-web
      - name: Build installer
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/dist/BIOMOTOR-Windows-Setup.exe
            apps/desktop/dist/BIOMOTOR-Mac.dmg
            apps/desktop/dist/BIOMOTOR-Linux.AppImage
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: [android, desktop]
    if: always() && (needs.android.result == 'success' || needs.desktop.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - run: ls -la files
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: BIOMOTOR apps ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}
          make_latest: 'true'
          body: |
            BIOMOTOR Sport and Fitness apps.
            - Android: BIOMOTOR-Android.apk
            - Windows: BIOMOTOR-Windows-Setup.exe
            - Mac: BIOMOTOR-Mac.dmg
            - Linux: BIOMOTOR-Linux.AppImage
            iPhone / iPad: open the website in Safari → Share → Add to Home Screen.
          files: files/*
