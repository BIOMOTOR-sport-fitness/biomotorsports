<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/bm-fav.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c8102e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BIOMOTOR">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<title>BIOMOTOR Sport and Fitness · Performance Platform</title>
<meta name="description" content="BIOMOTOR Sport and Fitness performance platform — athletes, testing, training, analytics and recruiting.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
 <aside class="side" id="side">
  <div class="brand">
   <div class="logo" id="sideLogo">B</div>
   <div><b id="sideOrg">Biomotor</b><small id="sideSub">Sports platform</small></div>
   <button class="collapse" id="collapseBtn" title="Collapse">‹</button>
  </div>
  <nav class="nav" id="nav"></nav>
 </aside>
 <div class="main">
  <header class="top">
   <button class="btn burger" id="burger">☰</button>
   <div class="crumb"><span class="dot"></span> Platform connected / <span id="crumbPage">Dashboard</span></div>
   <span class="sp"></span>
   <button class="btn sm" id="refreshBtn">Refresh</button>
   <select id="themeSel" style="width:auto" title="Appearance"><option value="System">🖥️ System</option><option value="Light">☀️ Light</option><option value="Dark">🌙 Dark</option></select>
   <input class="search" id="gSearch" placeholder="Search…">
   <div style="position:relative"><button class="btn" id="bellBtn">🔔 <span id="bellCount"></span></button></div>
   <div class="user"><div><b id="topUser">Owner</b><small id="topRole">Owner</small></div><div class="av" id="topAv">S</div><button class="btn sm ghost" id="logoutBtn" onclick="signOut()" title="Sign out" style="margin-left:6px">Logout</button></div>
  </header>
  <div class="card notif" id="notif"></div>
  <main class="content" id="view"></main>
 </div>
</div>

<button class="fab" id="aiBtn">AI Coach</button>
<div class="card drawer" id="aiDrawer"></div>

<div class="modal" id="modal"><div class="card" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script>globalThis.BIOMOTOR_CONFIG='sk/config.sk'</script>
<script src="js/app.js"></script>
<script>if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!globalThis.BIOMOTOR_NATIVE)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body>
</html>
